services:
  pixel-gomoku:
    build: .
    container_name: pixel-gomoku
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    environment:
      DATA_DIR: /app/data
      ALLOW_DEV_AUTH: ${ALLOW_DEV_AUTH:-0}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - gomoku-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  gomoku-data:
